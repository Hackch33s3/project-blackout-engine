services:
  engine:
    build: .
    container_name: project-blackout-engine
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - ENGINE_URL=http://localhost:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536M

  worker:
    build: .
    container_name: project-blackout-worker
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      - ENGINE_URL=http://localhost:8000
      - PYTHONUNBUFFERED=1
    command: python -u queue_worker.py
    depends_on:
      - engine
